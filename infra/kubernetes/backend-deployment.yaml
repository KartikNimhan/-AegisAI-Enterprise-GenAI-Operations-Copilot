# Backend (FastAPI) Deployment.
#
# replicas: 1 — deliberately, not a placeholder. The current document-
# upload path (app.storage.local.LocalFileStorage) writes to a local
# PersistentVolumeClaim (see backend-pvc.yaml), which is ReadWriteOnce:
# more than one replica would each see a different, inconsistent view of
# uploaded files. Scale this only after moving to an object-storage-backed
# DocumentStorage implementation, or after confirming a ReadWriteMany
# StorageClass is available — see
# docs/architecture/decisions/012-deployment-architecture.md, "Resource
# management," for the full reasoning. Everything else below (probes,
# rolling update strategy, resource requests/limits) is written to scale
# cleanly once that constraint is lifted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisai-backend
  labels:
    app.kubernetes.io/name: aegisai-backend
    app.kubernetes.io/part-of: aegisai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisai-backend
        app.kubernetes.io/part-of: aegisai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Replace with your registry/tag — see
          # docs/architecture/decisions/012-deployment-architecture.md,
          # "Image tagging," for the strategy (never `:latest`).
          image: aegisai-backend:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aegisai-backend-config
            - secretRef:
                name: aegisai-backend-secret
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          # Liveness: lightweight, no external dependency — a
          # database/Redis outage must not restart every backend Pod in a
          # loop (a restart storm fixes nothing if the dependency itself
          # is down). /health is a pure liveness check (app.api.v1.health)
          # with no connectivity check at all.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: /health/ready checks Postgres + Redis — exactly
          # what "can this Pod actually receive traffic" should mean; a
          # Pod that can't reach its database is correctly taken out of
          # the Service's endpoints without being killed.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Initial, conservative defaults — not benchmark-derived. Tune
            # against real usage before relying on these in production.
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            # The image's own USER (see the root Dockerfile) already runs
            # as a non-root `app` user with a fixed uid/gid baked in at
            # build time — runAsUser/runAsGroup are intentionally left
            # unset here so Kubernetes doesn't need to match that exact
            # uid; `runAsNonRoot: true` (pod-level, above) is still
            # enforced and would reject the container if it ever did run
            # as root.
            # readOnlyRootFilesystem is left false: uvicorn/Python write
            # transient files (e.g. __pycache__ under some conditions,
            # temp files for multipart upload parsing) outside the one
            # path (/data/uploads) that's already on its own volume —
            # forcing a read-only root here would require auditing and
            # emptyDir-mounting every such path, which is not done
            # blindly just to tick this box (see brief: "do not blindly
            # force readOnlyRootFilesystem if ... behavior requires
            # writable paths").
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: aegisai-backend-uploads
