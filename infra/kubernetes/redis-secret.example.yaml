# TEMPLATE ONLY — DO NOT `kubectl apply` THIS FILE AS-IS.
#
# The shape of the Secret that holds the Redis password (AIGSEC-005). Both the Redis Deployment
# (which requires it: Redis refuses to start without one) and the backend Deployment (which
# authenticates with it) read the same key, so the password lives in exactly one place. The value
# below is an obvious placeholder, not a credential.
#
# Create the real Secret through your own secure deployment process, without writing the value to
# disk or to shell history, for example:
#
#   kubectl create secret generic aegisai-redis-secret \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)"
#
# or, preferably, from your secret manager (External Secrets Operator, Sealed Secrets, a cloud
# KMS-backed store). Never commit the real value.
apiVersion: v1
kind: Secret
metadata:
  name: aegisai-redis-secret
  labels:
    app.kubernetes.io/name: aegisai-redis
    app.kubernetes.io/part-of: aegisai
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME_REDIS_PASSWORD"
