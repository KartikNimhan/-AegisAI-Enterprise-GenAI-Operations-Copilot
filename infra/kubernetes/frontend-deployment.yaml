# Frontend (React + Vite, served by nginx) Deployment — stateless (no
# server-side session state at all; unlike the original Streamlit app,
# this one renders entirely in the browser), so it scales horizontally
# without the backend's uploads-volume constraint.
#
# The browser talks only to this Deployment: its nginx serves the static
# app and proxies `/api/` to the aegisai-backend Service (BACKEND_UPSTREAM
# in frontend-configmap.yaml), so the backend needs no external exposure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisai-frontend
  labels:
    app.kubernetes.io/name: aegisai-frontend
    app.kubernetes.io/part-of: aegisai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisai-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisai-frontend
        app.kubernetes.io/part-of: aegisai
    spec:
      # No pod here talks to the Kubernetes API, so none gets a service-account token: a
      # compromised container then has no cluster credential to use.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Replace with your registry/tag — see
          # docs/architecture/decisions/012-deployment-architecture.md,
          # "Image tagging." Built from frontend/web/Dockerfile.
          image: aegisai-frontend:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegisai-frontend-config
          # nginx serving the static build — a plain `/` request is
          # sufficient (no app-specific health endpoint; see
          # frontend/web/Dockerfile's own HEALTHCHECK, the same check
          # used here).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Initial, conservative defaults — not benchmark-derived.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            # The image is nginx-unprivileged (user 101, port 8080), so
            # runAsNonRoot and the dropped capabilities hold without
            # exceptions; port 8080 needs no privilege. At start the
            # entrypoint writes config.js into the image's html directory
            # and nginx renders conf.d, so the root filesystem is written
            # once at start. That is why readOnlyRootFilesystem stays false:
            # setting it would need emptyDir mounts for those two paths
            # (and a /tmp mount), which has not been built or tested here.
            # (See backend-deployment.yaml's comment for the same reasoning.)
