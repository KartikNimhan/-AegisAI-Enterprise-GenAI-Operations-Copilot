# Frontend (React + Vite, served by nginx) Deployment — stateless (no
# server-side session state at all; unlike the original Streamlit app,
# this one renders entirely in the browser), so it scales horizontally
# without the backend's uploads-volume constraint.
#
# NOTE — browser reachability gap (see frontend-configmap.yaml's own
# comment): this app's API calls happen in the end user's BROWSER, not
# inside this Pod, so `API_BASE_URL` below must be a URL reachable from
# outside the cluster. This project has not yet decided how the backend
# itself gets exposed externally (see backend-service.yaml, ClusterIP-
# only) — that's a network-security decision for a future milestone, not
# made here. Until it is, this Deployment is not reachable end-to-end
# from outside the cluster even once applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisai-frontend
  labels:
    app.kubernetes.io/name: aegisai-frontend
    app.kubernetes.io/part-of: aegisai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisai-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisai-frontend
        app.kubernetes.io/part-of: aegisai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Replace with your registry/tag — see
          # docs/architecture/decisions/012-deployment-architecture.md,
          # "Image tagging." Built from frontend/web/Dockerfile.
          image: aegisai-frontend:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: aegisai-frontend-config
          # nginx serving the static build — a plain `/` request is
          # sufficient (no app-specific health endpoint; see
          # frontend/web/Dockerfile's own HEALTHCHECK, the same check
          # used here).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Initial, conservative defaults — not benchmark-derived.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem left false: stock nginx writes its
            # pid file and proxy/client-body temp dirs under /var/run and
            # /var/cache/nginx even when just serving static files — not
            # forced read-only just to tick the box (see
            # backend-deployment.yaml's own comment for the same
            # reasoning).
