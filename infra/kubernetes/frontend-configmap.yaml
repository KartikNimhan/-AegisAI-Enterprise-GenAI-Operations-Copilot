# Non-secret frontend configuration — the frontend has no credentials of
# its own at all, so there is no frontend-secret.yaml.
#
# IMPORTANT — unlike the original Streamlit app (which called the backend
# server-side, so the internal Service DNS name worked fine), this React
# app's API calls happen in the end USER'S BROWSER, outside the cluster
# entirely. `API_BASE_URL` must therefore be a URL that browser can
# reach — never the internal `aegisai-backend` Service name, which only
# resolves between Pods. This project has not yet decided how (or
# whether) the backend gets exposed externally (see backend-service.yaml,
# still ClusterIP-only — a network-security decision left to a future
# milestone), so the placeholder below is NOT a working default: replace
# it with your backend's real external URL once one exists, e.g. a
# second Ingress host/path routed to the `aegisai-backend` Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisai-frontend-config
  labels:
    app.kubernetes.io/name: aegisai-frontend
    app.kubernetes.io/part-of: aegisai
data:
  API_BASE_URL: "https://REPLACE_WITH_YOUR_BACKENDS_EXTERNAL_URL.example"
