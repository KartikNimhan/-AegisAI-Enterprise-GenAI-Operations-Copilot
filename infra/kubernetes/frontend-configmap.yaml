# Non-secret frontend configuration — the frontend has no credentials of
# its own at all, so there is no frontend-secret.yaml.
#
# The React app's API calls happen in the end user's BROWSER, outside the
# cluster. Rather than expose the backend, the frontend's nginx proxies
# `/api/` to the backend Service, so the browser only talks to the
# frontend's own origin:
#   - API_BASE_URL is EMPTY on purpose: "same origin" (see
#     frontend/web/src/config.ts). Set it to a full URL only if you expose
#     the backend separately (that also needs CORS_ORIGINS on the backend).
#   - BACKEND_UPSTREAM is where nginx forwards /api/ — a bare origin
#     (scheme://host[:port], no path); the entrypoint rejects anything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisai-frontend-config
  labels:
    app.kubernetes.io/name: aegisai-frontend
    app.kubernetes.io/part-of: aegisai
data:
  API_BASE_URL: ""
  BACKEND_UPSTREAM: "http://aegisai-backend:8000"
