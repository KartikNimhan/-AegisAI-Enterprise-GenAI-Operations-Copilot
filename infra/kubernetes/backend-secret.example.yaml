# TEMPLATE ONLY — DO NOT `kubectl apply` THIS FILE AS-IS.
#
# This is a safe-to-commit example showing the shape of the real Secret
# the backend Deployment expects (`aegisai-backend-secret`). Every value
# below is an obvious placeholder, not a real credential — copy this file
# to a location outside version control, fill in real values, and apply
# that instead; or, preferably, create the Secret directly without ever
# writing it to disk:
#
#   kubectl create secret generic aegisai-backend-secret \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://aegis:<real-password>@aegisai-postgres:5432/aegis' \
#     --from-literal=GROQ_API_KEY='<real-groq-api-key>'
#
# In a real deployment, prefer your cluster's/cloud provider's secret
# manager integration (e.g. External Secrets Operator, Sealed Secrets,
# a cloud KMS-backed secret store) over a plain `Secret` object checked
# into any repository — none of that is introduced in this milestone (see
# docs/architecture/decisions/012-deployment-architecture.md, "Secret
# handling," for why).
apiVersion: v1
kind: Secret
metadata:
  name: aegisai-backend-secret
  labels:
    app.kubernetes.io/name: aegisai-backend
    app.kubernetes.io/part-of: aegisai
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://REPLACE_ME_USER:REPLACE_ME_PASSWORD@REPLACE_ME_HOST:5432/aegis"
  # Optional: chat/agent/research endpoints return a typed 503 without
  # this, same as running locally without it — the stack still starts.
  GROQ_API_KEY: "REPLACE_ME_GROQ_API_KEY"
