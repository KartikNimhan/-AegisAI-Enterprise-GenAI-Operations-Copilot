# Non-secret backend configuration. Everything here is safe to view/commit
# — no credentials, no API keys. See backend-secret.example.yaml for what
# is NOT here.
#
# REDIS_URL has no embedded credential in this project's default
# configuration (no Redis auth is configured anywhere in app/db/redis.py),
# so it is treated as non-secret config, not a Secret value. DATABASE_URL
# embeds the Postgres password (`postgresql+asyncpg://user:PASSWORD@host/
# db`) and is deliberately NOT here — see backend-secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisai-backend-config
  labels:
    app.kubernetes.io/name: aegisai-backend
    app.kubernetes.io/part-of: aegisai
data:
  APP_NAME: "AegisAI"
  ENVIRONMENT: "kubernetes"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  API_V1_PREFIX: "/api/v1"
  REDIS_URL: "redis://aegisai-redis:6379/0"
  # Matches the PVC mounted in backend-deployment.yaml — see that file's
  # own comment on why DOCUMENT_STORAGE_DIR / replicas=1 are linked today.
  DOCUMENT_STORAGE_DIR: "/data/uploads"
  # MCP (Milestone 7) — the MCP server/client are both in-process; no
  # external MCP endpoint is ever configured here.
  TRUSTED_MCP_SERVERS: '["aegisai-internal"]'
  TRUSTED_MCP_TOOLS: '["search_knowledge_base","calculator","get_document_metadata"]'
  # A2A (Milestone 7/8) — the trusted agent is this same backend, called over
  # the pod's loopback interface. Settings only accept plain http for loopback
  # hosts (a cluster Service DNS name over http is rejected outside local
  # development), and the in-process call also keeps the caller's bearer token
  # inside the pod.
  TRUSTED_A2A_AGENTS: '["http://localhost:8000"]'
  # Authentication (M12 Phase 1a). The API refuses to start outside local
  # development until all three are set to your identity provider's values
  # (https URLs, except loopback). Left empty on purpose: there is no default
  # identity provider to point at.
  AUTH_ISSUER: ""
  AUTH_AUDIENCE: ""
  AUTH_JWKS_URL: ""
  # Rate limits: per signed-in user, counted in memory PER POD (replicas do not share counts, so the
  # effective limit is limit x replicas). 0 switches one limit off. Starting points to review.
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_LLM_REQUESTS: "30"
  RATE_LIMIT_DOCUMENT_UPLOADS: "10"
  RATE_LIMIT_EMBEDDING_JOBS: "5"
  # Input and resource bounds (ADR 016). Defaults shown; the code has the same defaults, so these
  # lines only matter when you change them. EMBEDDING_DIMENSION is deliberately NOT here: it must
  # equal the database column (384) and the API refuses to start otherwise.
  CHAT_HISTORY_MAX_MESSAGES: "40"
  CHAT_HISTORY_MAX_CHARS: "24000"
  DOCUMENT_MAX_UNCOMPRESSED_BYTES: "67108864"
  DOCUMENT_MAX_PDF_PAGES: "2000"
  DOCUMENT_MAX_EXTRACTED_CHARS: "20000000"
  MAX_REQUEST_BODY_BYTES: "16777216"
  A2A_MAX_RESPONSE_BYTES: "1048576"
  A2A_TOTAL_TIMEOUT_SECONDS: "30"
  LLM_STREAM_TOTAL_TIMEOUT_SECONDS: "300"
  AGENT_MEMORY_ENABLED: "true"
  # Metrics (docs/operations/observability.md): OFF by default. To enable, set this to "true" AND
  # add METRICS_TOKEN to the backend Secret (never to this file): the API refuses to start
  # outside local development with metrics enabled and no token.
  METRICS_ENABLED: "false"
