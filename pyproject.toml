[project]
name = "aegis-ai"
version = "0.1.0"
description = "AegisAI — Enterprise GenAI Operations Copilot (foundation milestone)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "groq>=1.7,<2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
    # Listed explicitly (not left as sentence-transformers' own transitive
    # dependency) so [tool.uv.sources] below can actually route it to the
    # CPU-only PyTorch index — verified empirically that uv silently
    # ignores a `tool.uv.sources` entry for a package that only appears
    # transitively. No version pin here: sentence-transformers' own
    # `torch>=2.2` constraint (plus the index override) still drives
    # resolution. See the CPU-only index block below and
    # docs/architecture/decisions/006-embedding-model.md /
    # app.config.Settings.embedding_device (default "cpu", unchanged) for
    # why this project never needs the CUDA build.
    "torch",
    "pgvector>=0.3",
    "langgraph>=1.2.12",
    "mcp>=2.3.0",
    "a2a-sdk>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyright>=1.1.385",
]
frontend = [
    "streamlit>=1.39",
    "httpx>=0.27",
]

[tool.uv]
package = false

# CPU-only PyTorch index — scoped to `torch` only (`explicit = true` means
# this index is never consulted for any other package, so nothing else's
# resolution/version is affected). Without this, PyPI's own default Linux
# wheel for `torch` depends on a full CUDA/NVIDIA toolchain
# (cuda-toolkit, nvidia-cudnn-cu13, nvidia-nccl-cu13, triton, ...) even
# though this project only ever runs embeddings on CPU
# (app.config.Settings.embedding_device defaults to "cpu" — see
# app/embeddings/providers/local.py) — those packages were timing out
# Docker image builds. Verified empirically against the installed
# uv==0.11.2: the resulting Linux/Windows wheel resolves to
# `torch==2.14.1+cpu` with no cuda-*/nvidia-*/triton dependency at all.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "frontend/streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["app", "services", "components"]

[tool.pyright]
include = ["backend/app", "backend/tests", "backend/scripts", "frontend/streamlit", "infra/kubernetes"]
exclude = ["**/__pycache__"]
extraPaths = ["backend", "frontend/streamlit"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# Session-scoped so the module-level async engine/Redis pool (each bound to
# the event loop that first used them) are reused consistently across tests,
# matching how the real app runs on a single long-lived event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires live Postgres and Redis (see docker-compose.yml)",
    "llm_integration: requires a real GROQ_API_KEY and makes live API calls",
    "embedding_integration: loads the real Sentence Transformers model and a live Postgres",
    "mcp_integration: spawns a real MCP stdio subprocess and a live Postgres",
    "a2a_integration: makes a real HTTP call to a running A2A Research Agent endpoint",
    "multi_agent_integration: runs a full multi-agent workflow against a real HTTP server",
]
