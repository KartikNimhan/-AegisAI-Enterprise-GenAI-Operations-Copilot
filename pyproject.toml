[project]
name = "aegis-ai"
version = "0.1.0"
description = "AegisAI — Enterprise GenAI Operations Copilot (foundation milestone)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "groq>=1.7,<2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyright>=1.1.385",
]
frontend = [
    "streamlit>=1.39",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["app", "services"]

[tool.pyright]
include = ["backend/app", "backend/tests"]
exclude = ["**/__pycache__"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# Session-scoped so the module-level async engine/Redis pool (each bound to
# the event loop that first used them) are reused consistently across tests,
# matching how the real app runs on a single long-lived event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires live Postgres and Redis (see docker-compose.yml)",
    "llm_integration: requires a real GROQ_API_KEY and makes live API calls",
    "embedding_integration: loads the real Sentence Transformers model and a live Postgres",
]
