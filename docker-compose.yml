services:
  backend:
    build: .
    # Always (re)build from the local sources: without this, `docker compose up -d` or
    # `docker compose run` reuses whatever image was built last time, so the running
    # stack silently drifts from the code (a stale frontend image listening on the old
    # port; a backend image that predates the authentication changes and migrations).
    # Layer caching keeps an unchanged build fast.
    pull_policy: build
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AegisAI
      ENVIRONMENT: docker
      DEBUG: "false"
      LOG_LEVEL: INFO
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      # Explicit (not left to the config default): the Dockerfile only
      # copies backend/app, not the whole repo, so the config's "relative
      # to the repo root" fallback would resolve to a different, surprising
      # path inside the container. Bind-mounted below to the host's
      # data/uploads/ so uploads land in the same place as local (non-
      # Docker) runs and survive container recreation.
      DOCUMENT_STORAGE_DIR: /data/uploads
      # Passed through from the host shell or a root-level .env file (which
      # `docker compose` itself reads for ${...} substitution — a separate
      # mechanism from the application's own `app.config.Settings`, which
      # never reads a .env file from inside the container: no secret is
      # ever baked into the image). Empty by default so the stack still
      # starts without one — only chat/agent endpoints need it, same as
      # running locally without Docker.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Authentication (Milestone 12). ENVIRONMENT is "docker", so the backend
      # REFUSES TO START unless all three are set (it names the missing ones in
      # its startup error). They are passed through empty by default so that
      # `docker compose config` still validates (CI runs it with none set). The
      # issuer must equal the token's `iss` exactly (outside local development
      # https is required); the key-set URL is separate because the URL the
      # backend uses to reach the identity provider can differ from the one the
      # browser used. See the README and .env.example.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "docker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # A one-off migration runner, not started by `docker compose up` (no
  # `restart` policy, and nothing depends on it) — the same backend image,
  # just with its command overridden to run the existing Alembic
  # migrations once and exit. Mirrors infra/kubernetes/migration-job.yaml;
  # see docs/architecture/decisions/012-deployment-architecture.md,
  # "Migration strategy," for why this is a separate step rather than
  # something the API server (or every replica of it) runs implicitly on
  # startup. Invoke with `make docker-migrate` or
  # `docker compose run --rm migrate`.
  migrate:
    build: .
    # Always (re)build from the local sources: without this, `docker compose up -d` or
    # `docker compose run` reuses whatever image was built last time, so the running
    # stack silently drifts from the code (a stale frontend image listening on the old
    # port; a backend image that predates the authentication changes and migrations).
    # Layer caching keeps an unchanged build fast.
    pull_policy: build
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  # React app (replaces the Streamlit UI as the default frontend — see
  # frontend/web/). Unlike `AEGIS_BACKEND_URL` above, this URL is fetched
  # by the user's own BROWSER, which sits outside the Compose network
  # entirely — it must be the backend's host-published port
  # (http://localhost:8000), never the internal `http://backend:8000`
  # service name, which only resolves *between* containers. See
  # frontend/web/src/config.ts's own docstring.
  frontend:
    build:
      context: frontend/web
    # Always (re)build from the local sources: without this, `docker compose up -d` or
    # `docker compose run` reuses whatever image was built last time, so the running
    # stack silently drifts from the code (a stale frontend image listening on the old
    # port; a backend image that predates the authentication changes and migrations).
    # Layer caching keeps an unchanged build fast.
    pull_policy: build
    ports:
      - "3000:8080"
    environment:
      API_BASE_URL: http://localhost:8000
      # Browser sign-in. OIDC_AUTHORITY is the identity provider's issuer URL as the
      # BROWSER reaches it (the same value as AUTH_ISSUER); OIDC_CLIENT_ID is the id
      # of the public client registered for this app. Public values, not secrets.
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-aegisai-web}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # The original Streamlit UI — no longer started by `docker compose up`
  # by default (profile-gated), kept available via
  # `docker compose --profile legacy-ui up frontend-streamlit`.
  frontend-streamlit:
    build:
      context: .
      dockerfile: frontend/streamlit/Dockerfile
    # Always (re)build from the local sources: without this, `docker compose up -d` or
    # `docker compose run` reuses whatever image was built last time, so the running
    # stack silently drifts from the code (a stale frontend image listening on the old
    # port; a backend image that predates the authentication changes and migrations).
    # Layer caching keeps an unchanged build fast.
    pull_policy: build
    ports:
      - "8501:8501"
    environment:
      AEGIS_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    profiles: ["legacy-ui"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a locally
      # installed PostgreSQL. Container-to-container traffic (the backend
      # service) always uses the default 5432 and is unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380 (not 6379) to avoid colliding with a locally
      # installed Redis. Container-to-container traffic (the backend
      # service) always uses the default 6379 and is unaffected.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No named volume: Redis is currently only used for the readiness
    # check (app.db.redis.check_redis) — no application data is stored in
    # it yet, so it is correctly treated as ephemeral cache infrastructure,
    # not a persistence requirement. Revisit if a future milestone starts
    # storing real data in it.

volumes:
  pgdata:
