# Weekly update pull requests. Dependabot only OPENS pull requests; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # One entry per directory that holds a Dockerfile (base-image updates).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend/streamlit"
    schedule:
      interval: "weekly"
