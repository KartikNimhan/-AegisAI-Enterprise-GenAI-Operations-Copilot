name: RAG end-to-end with a live LLM (manual, approval-gated)

# The one workflow that calls a real LLM provider: real embeddings and pgvector retrieval, then a
# real Groq answer checked for grounding and citations
# (backend/tests/integration/test_rag_end_to_end_live.py). Started by hand only. The no-secrets
# retrieval workflow, rag-integration.yml, is separate and stays secret-free.
#
# Credentials: the job runs in the `groq-live` GitHub Environment. Configure it BEFORE adding the
# secret: a required reviewer (so every run waits for an approval), deployments limited to `main`,
# and an environment secret GROQ_API_KEY holding a dedicated, spending-capped key. GitHub creates a
# missing environment automatically on first use, WITHOUT protection rules. The key is exposed to
# the single pytest step only. Without it the tests skip, and the final check fails the job.
#
# Isolation: the database is this job's own throwaway service container on a GitHub-hosted runner,
# reachable only at localhost there. `DATABASE_URL` is set explicitly below, and `.env` is never
# part of a checkout. All test data is synthetic. Never point this at a real database, take the
# database URL from a secret, or run it on a self-hosted runner.
#
# Known limitations: `pgvector/pgvector:pg16` is a floating tag (the same one ci.yml uses), the
# embedding model revision is not pinned (ADR 017, D-8), and model answers vary between runs.

on:
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: rag-e2e-live-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.2"

jobs:
  rag-end-to-end:
    name: Real embeddings + pgvector + live Groq answer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: groq-live
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This job's own disposable service above, and nothing else.
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      # An unreachable database FAILS the tests instead of skipping them.
      AEGIS_REQUIRE_SERVICES: "1"
      # The opt-in gates of the live tests (the key is added on the pytest step only).
      RUN_EMBEDDING_INTEGRATION: "1"
      RUN_RAG_E2E_LIVE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Do not leave the job's token in .git/config, where test code or a dependency could
          # read it. Nothing later in this job needs Git credentials.
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: cd backend && uv run alembic upgrade head
      # -rs lists any skip with its reason; the JUnit report feeds the check below.
      - name: Run the live RAG end-to-end tests
        id: tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: >-
          uv run pytest -v -rs -p no:cacheprovider --junitxml=rag-e2e-live-junit.xml
          backend/tests/integration/test_rag_end_to_end_live.py
      # pytest exits 0 when every test is skipped (for example without the key). This makes
      # "skipped", "missing" and "fewer than expected" a failed job, never a green one. It also runs
      # (and writes the summary) after a failed pytest step, and then fails itself.
      - name: Fail unless every live test ran and passed
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JUNIT_REPORT: rag-e2e-live-junit.xml
          EXPECTED_TESTS: "2"
          PYTEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          path = os.environ["JUNIT_REPORT"]
          expected = int(os.environ["EXPECTED_TESTS"])
          outcome = os.environ.get("PYTEST_OUTCOME") or "unknown"


          def report(line):
              print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write(f"## RAG end-to-end (live LLM)\n\n{line}\n")


          try:
              root = ET.parse(path).getroot()
          except (OSError, ET.ParseError) as exc:
              report(f"No readable JUnit report ({type(exc).__name__}); pytest step outcome: {outcome}")
              sys.exit(f"No readable JUnit report at {path}: the tests did not run.")
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          totals = {
              key: sum(int(suite.get(key, "0")) for suite in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          report(
              f"tests={totals['tests']} skipped={totals['skipped']} failures={totals['failures']} "
              f"errors={totals['errors']} (expected {expected} passed); pytest step outcome: {outcome}"
          )
          if outcome != "success":
              sys.exit(f"The pytest step did not succeed (outcome: {outcome}).")
          if totals["failures"] or totals["errors"]:
              sys.exit("Some tests failed or errored.")
          if totals["skipped"]:
              sys.exit(f"{totals['skipped']} test(s) were skipped; every one must run (is the GROQ_API_KEY environment secret set?).")
          if totals["tests"] != expected:
              sys.exit(f"Expected exactly {expected} tests, the report has {totals['tests']}.")
          print(f"All {expected} tests ran and passed.")
          PY
