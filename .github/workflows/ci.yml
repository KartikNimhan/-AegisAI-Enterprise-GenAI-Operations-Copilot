name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job here writes to the repository, so the token is read-only.
permissions:
  contents: read

env:
  UV_VERSION: "0.11.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      REDIS_URL: redis://localhost:6379/0
      # The service database role is a superuser, so the migration round-trip tests can create and
      # drop their own throwaway databases (they never touch the `aegis` database). Locally they
      # are opt-in; here they run, covering migrations 0005-0007 and the legacy-data assignment.
      RUN_MIGRATION_ROUNDTRIP: "1"
      # The services above are part of this job, so an unreachable Postgres or Redis FAILS the
      # integration tests instead of skipping them (otherwise a broken service container would
      # leave every isolation, repository and migration test skipped and the job green). See
      # backend/tests/integration/requirements.py.
      AEGIS_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: cd backend && uv run alembic upgrade head
      # -rs lists every skipped test with its reason, so a skip is visible in the log.
      - run: uv run pytest -v -rs

  # The default UI as of the React migration (see docker-compose.yml's
  # `frontend` service and README) — npm install/lint/build/test for
  # frontend/web/, the same four checks a contributor runs locally.
  frontend-react-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  # The original Streamlit UI — no longer the default (see
  # docker-compose.yml's profile-gated `frontend-streamlit` service), but
  # its own test suite is kept running here since the app and its
  # Dockerfile are still in the repo and still documented as usable.
  frontend-streamlit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      # No Postgres/Redis/Groq here — the frontend test suite mocks every
      # backend call (see frontend/streamlit/tests), so it never needs a
      # live backend.
      - run: uv run --group frontend pytest frontend/streamlit/tests -v

  docker-build:
    # Builds all three images to prove the Dockerfiles are actually
    # buildable — a real, independent check this project's own local dev
    # environment could not perform (see
    # docs/architecture/decisions/012-deployment-architecture.md, "CI/CD").
    # Never pushes anywhere — no registry is configured for this project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: false
          tags: aegisai-backend:ci
      - name: Build React frontend image (default UI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: false
          tags: aegisai-frontend:ci
      - name: Build Streamlit frontend image (legacy UI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: frontend/streamlit/Dockerfile
          push: false
          tags: aegisai-frontend-streamlit:ci
      - name: Validate docker-compose.yml
        run: docker compose config

  k8s-manifests:
    # Client-side structural validation only — no cluster is available in
    # CI either; see infra/kubernetes/validate_manifests.py's own
    # docstring for why this, and not kubeconform/kubeval/a live
    # `kubectl apply --dry-run`, is what runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run python infra/kubernetes/validate_manifests.py
