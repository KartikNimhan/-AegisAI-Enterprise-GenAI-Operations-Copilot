name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.11.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: cd backend && uv run alembic upgrade head
      - run: uv run pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      # No Postgres/Redis/Groq here — the frontend test suite mocks every
      # backend call (see frontend/streamlit/tests), so it never needs a
      # live backend.
      - run: uv run --group frontend pytest frontend/streamlit/tests -v

  docker-build:
    # Builds both images to prove the Dockerfiles are actually buildable
    # — a real, independent check this project's own local dev environment
    # could not perform (see
    # docs/architecture/decisions/012-deployment-architecture.md, "CI/CD").
    # Never pushes anywhere — no registry is configured for this project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: aegisai-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/streamlit/Dockerfile
          push: false
          tags: aegisai-frontend:ci
      - name: Validate docker-compose.yml
        run: docker compose config

  k8s-manifests:
    # Client-side structural validation only — no cluster is available in
    # CI either; see infra/kubernetes/validate_manifests.py's own
    # docstring for why this, and not kubeconform/kubeval/a live
    # `kubectl apply --dry-run`, is what runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run python infra/kubernetes/validate_manifests.py
