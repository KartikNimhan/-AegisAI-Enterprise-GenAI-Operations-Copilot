name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job here writes to the repository, so the token is read-only.
permissions:
  contents: read

env:
  UV_VERSION: "0.11.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests use only TEST_DATABASE_URL / TEST_REDIS_URL (backend/tests/isolation.py refuses a
      # database whose name does not end in `_test`). DATABASE_URL is for the migration step, which
      # uses the application's settings, and names the same test database.
      TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis_test
      # The service database role is a superuser, so the migration round-trip tests can create and
      # drop their own throwaway databases (they never touch the `aegis_test` database). Locally
      # they are opt-in; here they run, covering migrations 0005-0007 and the legacy-data
      # assignment.
      RUN_MIGRATION_ROUNDTRIP: "1"
      # The services above are part of this job, so an unreachable Postgres or Redis FAILS the
      # integration tests instead of skipping them (otherwise a broken service container would
      # leave every isolation, repository and migration test skipped and the job green). See
      # backend/tests/integration/requirements.py.
      AEGIS_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: cd backend && uv run alembic upgrade head
      # -rs lists every skipped test with its reason, so a skip is visible in the log.
      - run: uv run pytest -v -rs

  # The default UI as of the React migration (see docker-compose.yml's
  # `frontend` service and README) — npm install/lint/build/test for
  # frontend/web/, the same checks a contributor runs locally. Since M10.0 it also runs the
  # browser tests (Playwright, Chromium only): accessibility (axe) in both themes, layout at
  # 375/768/1280 px, keyboard and focus, reduced motion, and the production build under the
  # production Content-Security-Policy. They use mock data only: no backend, identity provider or
  # model is called. The job name is unchanged, so it stays a required check.
  frontend-react-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # The browser version is pinned by @playwright/test in package-lock.json.
      - name: Install the Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      # Needs the production build from `npm run build` above (the CSP tests serve dist/).
      - name: Browser tests (Playwright)
        run: npm run test:e2e
      - name: Keep the Playwright report when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The original Streamlit UI — no longer the default (see
  # docker-compose.yml's profile-gated `frontend-streamlit` service), but
  # its own test suite is kept running here since the app and its
  # Dockerfile are still in the repo and still documented as usable.
  frontend-streamlit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      # No Postgres/Redis/Groq here — the frontend test suite mocks every
      # backend call (see frontend/streamlit/tests), so it never needs a
      # live backend.
      - run: uv run --group frontend pytest frontend/streamlit/tests -v

  docker-build:
    # Builds all three images to prove the Dockerfiles are actually
    # buildable — a real, independent check this project's own local dev
    # environment could not perform (see
    # docs/architecture/decisions/012-deployment-architecture.md, "CI/CD").
    # Never pushes anywhere — no registry is configured for this project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: aegisai-backend:ci
      - name: Build React frontend image (default UI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: false
          tags: aegisai-frontend:ci
      - name: Build Streamlit frontend image (legacy UI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/streamlit/Dockerfile
          push: false
          tags: aegisai-frontend-streamlit:ci
      - name: Validate docker-compose.yml
        run: docker compose config

  k8s-manifests:
    # Client-side structural validation only — no cluster is available in
    # CI either; see infra/kubernetes/validate_manifests.py's own
    # docstring for why this, and not kubeconform/kubeval/a live
    # `kubectl apply --dry-run`, is what runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no job token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run python infra/kubernetes/validate_manifests.py
